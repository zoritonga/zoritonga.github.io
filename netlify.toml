[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo sin-build"
  # Si GitHub solo recibió una copia del catálogo (carpeta data), NO vuelve a publicar el sitio.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
